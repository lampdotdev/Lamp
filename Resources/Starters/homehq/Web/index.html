<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F2EEE6">
  <title>Home HQ</title>
  <!-- Based on photo-frame-dashboard by Wes Bos (MIT, LICENSE-photo-frame-dashboard):
       https://github.com/wesbos/photo-frame-dashboard -->
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/views/home.css">
  <link rel="stylesheet" href="css/views/calendar.css">
  <link rel="stylesheet" href="css/views/tasks.css">
  <link rel="stylesheet" href="css/views/shopping.css">
  <link rel="stylesheet" href="css/views/photos.css">
  <link rel="stylesheet" href="css/views/ambient.css">
</head>
<body>
  <div class="stage" id="stage" data-mode="day">
    <nav class="rail" id="rail" aria-label="Sections">
      <button class="rail-item" data-go="home"><svg class="i" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg><span>Today</span></button>
      <button class="rail-item" data-go="calendar"><svg class="i" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span>Calendar</span></button>
      <button class="rail-item" data-go="tasks"><svg class="i" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M7.5 12l3 3 6-6"/></svg><span>Chores</span></button>
      <button class="rail-item" data-go="shopping"><svg class="i" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h2.2l2.3 11h10.8L21 8H6.5"/><circle cx="10" cy="19.5" r="1.5"/><circle cx="17" cy="19.5" r="1.5"/></svg><span>Shopping</span></button>
      <button class="rail-item" data-go="photos"><svg class="i" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-8 8"/></svg><span>Photos</span></button>
      <button class="rail-item rail-settings" id="railSettings"><svg class="i" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg><span>Settings</span></button>
      <button class="rail-clock" id="railClock" aria-label="Clock: settings"></button>
    </nav>

    <main class="views">
      <section class="view" id="view-home" data-view="home"></section>
      <section class="view" id="view-calendar" data-view="calendar"></section>
      <section class="view" id="view-tasks" data-view="tasks"></section>
      <section class="view" id="view-shopping" data-view="shopping"></section>
      <section class="view view--bleed" id="view-photos" data-view="photos"></section>
      <div class="banners" id="banners"></div>
    </main>

    <div class="toasts" id="toasts" aria-live="polite"></div>
    <div class="sheet-layer" id="sheetLayer"></div>
    <div class="takeover" id="takeover" role="alertdialog"></div>
    <div class="ambient" id="ambient"></div>
    <div class="night" id="night"></div>
    <div class="demo" id="demo"></div>
  </div>

  <!-- Lamp's building blocks (LampStore, LampNative, the remote), then the dashboard; each script adds to window.App
       in this order. -->
  <script src="lamp.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/system.js"></script>
  <script src="js/slideshow.js"></script>
  <script src="js/live.js"></script>
  <script src="js/views/home.js"></script>
  <script src="js/views/calendar.js"></script>
  <script src="js/views/tasks.js"></script>
  <script src="js/views/shopping.js"></script>
  <script src="js/views/photos.js"></script>
  <script src="js/views/ambient.js"></script>
  <script src="js/views/editor.js"></script>
  <script src="js/views/setup.js"></script>
  <script src="js/sync.js"></script>
</body>
</html>
