# Builds Lamp Dev and runs the regression tests for every pull request and every push to main.
# A development build: no signing certificate, no notarization, no release secrets. The release itself is
# mac-release.yml, which runs only for v* tags.
name: Build

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to the same PR cancels the run for the old one.
concurrency:
  group: build-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # build.sh reads the version from the nearest release tag

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app
          xcodebuild -version

      - name: Cache pi and llama.cpp downloads
        uses: actions/cache@v4
        with:
          path: vendor
          key: vendor-${{ hashFiles('build.sh') }}

      - name: Cache Swift build products
        uses: actions/cache@v4
        with:
          path: .build
          key: swift-build-${{ runner.os }}-${{ hashFiles('Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            swift-build-${{ runner.os }}-${{ hashFiles('Package.resolved') }}-

      - name: Build Lamp Dev
        run: ./build.sh

      - name: Regression tests
        # About a quarter of an hour on a fast Mac. The suites that need a key, a device or the live cases skip
        # themselves when those aren't there.
        run: swift test
