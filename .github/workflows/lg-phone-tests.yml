name: LG phone service tests

on:
  pull_request:
    paths:
      - "Resources/LGPhones/**"
      - "Tests/LGPhones/**"
      - "scripts/update-lg-ws.sh"
      - ".github/workflows/lg-phone-tests.yml"
  push:
    branches: [main]
    paths:
      - "Resources/LGPhones/**"
      - "Tests/LGPhones/**"
      - "scripts/update-lg-ws.sh"
      - ".github/workflows/lg-phone-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lg-phone-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        # The service must still run on webOS TV 5.0's Node 8.12, as well as the newer TV generations.
        node: ["8.12.0", "12", "16", "20"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Check the LG phone service
        # Uses the bundled ws library on real sockets; webos-service is stood in for, so no TV is needed.
        run: node Tests/LGPhones/relay-test.js
