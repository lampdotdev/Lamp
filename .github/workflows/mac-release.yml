# Builds, signs, notarizes, and publishes Forge when a tag like v0.2.0 is pushed.
#
# Secrets live in the "release" environment, which only v* tags can use; only repo
# admins can create v* tags (ruleset "Protect release tags"). See RELEASING.md:
#   MACOS_CERT_P12_BASE64   Developer ID Application certificate + private key, exported as .p12, base64-encoded
#   MACOS_CERT_PASSWORD     Password for the .p12
#   NOTARY_APPLE_ID         Apple ID used for notarization
#   NOTARY_TEAM_ID          Apple Developer Team ID
#   NOTARY_PASSWORD         App-specific password for that Apple ID
name: Mac release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:  # re-run a release: gh workflow run mac-release.yml --ref v0.2.0 -f version=0.2.0
    inputs:
      version:
        description: "Version (e.g. 0.2.0); run against the matching v* tag"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 60
    environment: release
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app
          xcodebuild -version

      - name: Cache pi and llama.cpp downloads
        uses: actions/cache@v4
        with:
          path: vendor
          key: vendor-${{ hashFiles('build.sh') }}

      - name: Import signing certificate
        env:
          P12: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KEYCHAIN=$RUNNER_TEMP/signing.keychain-db
          KC_PASS=$(openssl rand -hex 16)
          echo "$P12" | base64 --decode > $RUNNER_TEMP/cert.p12
          security create-keychain -p "$KC_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KC_PASS" "$KEYCHAIN"
          security import $RUNNER_TEMP/cert.p12 -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KC_PASS" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm $RUNNER_TEMP/cert.p12

      - name: Store notary credentials
        run: |
          xcrun notarytool store-credentials forge-notary \
            --apple-id "${{ secrets.NOTARY_APPLE_ID }}" \
            --team-id "${{ secrets.NOTARY_TEAM_ID }}" \
            --password "${{ secrets.NOTARY_PASSWORD }}"

      - name: Build, sign, notarize
        run: |
          VERSION="${{ github.event.inputs.version }}"
          VERSION="${VERSION:-${GITHUB_REF_NAME#v}}"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          ./release.sh "$VERSION"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" "dist/Forge-$VERSION.dmg" \
            --title "Forge $VERSION" --generate-notes || \
          gh release upload "v$VERSION" "dist/Forge-$VERSION.dmg" --clobber
