# Builds Lamp on every pull request with the Xcode the release is built with (.github/xcode-version), so code that
# only a newer Xcode accepts is caught here rather than when a release is tagged. The regression tests take about
# twenty minutes of a macOS runner, and GitHub runs only a few of those at a time for the organization, so they run
# each night on main and when started by hand (Actions → Mac build → Run workflow), not on every pull request. No signing and no release secrets. The runner is GitHub's `xcode-27` image (macOS 27, Xcode 27),
# chosen on purpose while it's a preview: it's the Xcode the team builds and generates apps with.
name: Mac build

# On every pull request, whatever it touches: main's ruleset requires the build check, and a check that never reports
# would hold a pull request forever.
on:
  pull_request:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

concurrency:
  group: mac-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    if: github.event_name == 'pull_request'
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s "/Applications/Xcode_$(cat .github/xcode-version).app"
          xcodebuild -version

      - name: Cache Swift packages and build
        uses: actions/cache@v4
        with:
          path: .build
          key: mac-build-${{ hashFiles('.github/xcode-version', 'Package.resolved') }}

      - name: Build
        run: swift build

  test:
    if: github.event_name != 'pull_request'
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s "/Applications/Xcode_$(cat .github/xcode-version).app"
          xcodebuild -version

      - name: Cache Swift packages and build
        uses: actions/cache@v4
        with:
          path: .build
          key: mac-test-${{ hashFiles('.github/xcode-version', 'Package.resolved') }}

      - name: Bug report checks
        # These standalone checks live outside the Swift package's regression test target.
        run: scripts/test-bug-report.sh

      - name: Regression tests
        # Each test in a process of its own, several at once: most of the suite waits on compilers, sockets and apps it
        # starts rather than on the processor, so it takes a few minutes instead of twenty. The suites that need a key,
        # a device or the live cases skip themselves when those aren't there.
        run: swift test --parallel --num-workers 6
