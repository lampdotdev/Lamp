name: Website tests

on:
  pull_request:
    paths:
      - "site/**"
      - "Sources/Lamp/WishLink.swift"
      - "Sources/Lamp/Wish.swift"
      - "Sources/LampSidebarKit/RemixPanel.swift"
      - ".github/workflows/site-tests.yml"
  push:
    branches: [main]
    paths:
      - "site/**"
      - "Sources/Lamp/WishLink.swift"
      - "Sources/Lamp/Wish.swift"
      - "Sources/LampSidebarKit/RemixPanel.swift"
      - ".github/workflows/site-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: site/package.json
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install Redis for the quota checks
        # The test starts its own temporary server from redis-server and redis-cli. They're copied out of Redis's own
        # image, from Docker Hub, rather than installed from Ubuntu's mirror, which runners haven't always reached.
        run: |
          image=redis:7.4.11-bookworm
          for try in 1 2 3; do docker pull -q "$image" && break; sleep 10; done
          id=$(docker create "$image")
          mkdir -p "$RUNNER_TEMP/redis"
          docker cp -L "$id:/usr/local/bin/redis-server" "$RUNNER_TEMP/redis/"
          docker cp -L "$id:/usr/local/bin/redis-cli" "$RUNNER_TEMP/redis/"
          docker rm "$id" > /dev/null
          echo "$RUNNER_TEMP/redis" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/redis/redis-server" --version
          "$RUNNER_TEMP/redis/redis-cli" --version

      - name: Install dependencies
        run: npm ci

      - name: Website tests
        run: npm test
        env:
          # Here the Redis test runs or fails: it never skips itself for want of Redis.
          LAMP_REQUIRE_REDIS: "1"
