# Type-checks the Swift Lamp writes into every app (LampSupport.swift and its companions) with the oldest Xcode the
# README promises people may build with, and with the Xcode of the macOS before the current one: the apps are
# compiled on the person's Mac with whatever Apple's tools they have, not with the Xcode Lamp itself is built with.
# A construct only a newer compiler accepts fails here, on the pull request, rather than on someone's Mac after a
# release. The starters' own Swift is checked with them (scripts/check-starters.sh).
name: Support files

on:
  pull_request:
    paths:
      - "Sources/Lamp/Template*.swift"
      - "Sources/Lamp/GameKit.swift"
      - "Resources/GameKit/**"
      - "Resources/Starters/**"
      - "scripts/check-starters.sh"
      - "scripts/fetch-starters.sh"
      - ".github/workflows/support-files.yml"
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: support-files-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            xcode: "26.6"
          - runner: macos-15
            xcode: "16.4"
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode ${{ matrix.xcode }}
        run: |
          sudo xcode-select -s "/Applications/Xcode_${{ matrix.xcode }}.app"
          xcodebuild -version

      - name: Fetch the starters
        # Each starter's tree is its repository at the commit Resources/Starters/<folder>/starter.md pins.
        run: scripts/fetch-starters.sh

      - name: Type-check the support files and the starters
        run: scripts/check-starters.sh
