name: CLI tests

on:
  pull_request:
    paths:
      - "cli/**"
      - "site/lib/**"
      - "Resources/GameKit/**"
      - "Resources/Devices/**"
      - "Resources/WebHost/**"
      - ".github/workflows/cli-tests.yml"
  push:
    branches: [main]
    paths:
      - "cli/**"
      - "site/lib/**"
      - "Resources/GameKit/**"
      - "Resources/Devices/**"
      - "Resources/WebHost/**"
      - ".github/workflows/cli-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cli-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run tests
        run: node --test cli/tests/*.test.mjs
