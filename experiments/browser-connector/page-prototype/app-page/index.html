<!doctype html><html><head><meta charset="utf-8"><title>Recipe Box</title>
<style>
body{margin:0;font:14px/1.45 -apple-system,sans-serif;color:#2b1d12;background:linear-gradient(160deg,#fff4e6,#ffe1c2 60%,#ffd0a8)}
header{padding:18px 18px 10px}h1{font:700 28px/1.1 Georgia,serif;margin:0;letter-spacing:-.5px}
.sub{color:#8a5a36;margin-top:4px}
.card{margin:12px 14px;padding:14px;border-radius:16px;background:rgba(255,255,255,.75);box-shadow:0 6px 24px rgba(140,70,20,.18);animation:rise .5s ease-out}
@keyframes rise{from{transform:translateY(12px);opacity:0}}
.ring{display:flex;gap:14px;align-items:center}svg{flex:none}
button{font:600 15px -apple-system,sans-serif;border:0;border-radius:999px;padding:11px 18px;background:#d9622b;color:white;cursor:pointer;box-shadow:0 3px 0 #a44317}
button:active{transform:translateY(2px);box-shadow:0 1px 0 #a44317}
#saved{white-space:pre-line}code{font-size:12px}.probe{font-size:12px;color:#6b4a30}
</style></head><body>
<header><h1>Recipe Box</h1><div class="sub">This whole sidebar is the app's own page.</div></header>
<div class="card ring">
  <svg width="64" height="64" viewBox="0 0 36 36"><circle cx="18" cy="18" r="15" fill="none" stroke="#f6c9a5" stroke-width="5"/>
  <circle id="arc" cx="18" cy="18" r="15" fill="none" stroke="#d9622b" stroke-width="5" stroke-linecap="round" stroke-dasharray="0 100" transform="rotate(-90 18 18)"/></svg>
  <div><b id="count">0 words</b><div class="sub">read from this page</div></div>
</div>
<div class="card"><button id="save">Save this recipe</button><p id="saved"></p></div>
<div class="card probe" id="probes"></div>
<script>
// Everything the page knows of the person's tab comes through the panel around it, by postMessage.
const parentOrigin = location.ancestorOrigins[0];
let next = 0; const waiting = {};
function ask(body) {
  const id = ++next;
  return new Promise(resolve => { waiting[id] = resolve; parent.postMessage({...body, id}, parentOrigin); });
}
addEventListener('message', e => {
  if (e.source !== parent || e.origin !== parentOrigin || e.data?.lamp !== 'answer') return;
  waiting[e.data.id]?.(e.data); delete waiting[e.data.id];
});
document.getElementById('save').onclick = async () => {
  const r = await ask({lamp: 'read', scope: 'page'});
  if (r.error) { document.getElementById('saved').textContent = r.error; return; }
  const words = r.page.text.split(/\s+/).filter(Boolean).length;
  document.getElementById('count').textContent = words + ' words';
  document.getElementById('arc').setAttribute('stroke-dasharray', Math.min(94, words / 4) + ' 100');
  document.getElementById('saved').textContent = 'Saved “' + r.page.title + '”\n' + r.page.text.slice(0, 140) + '…';
};
// What this page can't do, checked from inside it.
(async () => {
  const lines = [];
  const hello = await ask({lamp: 'hello', readsPage: true});
  lines.push('framed by: ' + parentOrigin + ' (tab ' + hello.tab + ')');
  lines.push('chrome.runtime here: ' + (typeof chrome !== 'undefined' && chrome.runtime?.id ? 'yes' : 'no'));
  try { parent.document.title; lines.push('read the panel: yes'); } catch { lines.push('read the panel: no'); }
  try { top.location.href = 'https://example.com/'; lines.push('navigate the panel: tried'); } catch { lines.push('navigate the panel: no'); }
  lines.push('open a popup: ' + (window.open('https://example.com/') ? 'yes' : 'no'));
  const sneaky = await ask({lamp: 'read', scope: 'page'});
  lines.push('read without a click: ' + (sneaky.error ? 'refused' : 'yes, ' + sneaky.page.text.length + ' chars'));
  document.getElementById('probes').textContent = lines.join('\n');
  document.getElementById('probes').style.whiteSpace = 'pre-line';
})();
</script></body></html>
