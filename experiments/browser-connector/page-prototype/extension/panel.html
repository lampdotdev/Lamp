<!doctype html><html><head><meta charset="utf-8"><title>Lamp</title>
<style>
:root{color-scheme:light dark;--bg:#fcfcf7;--ink:#252820;--muted:#626858;--line:#e0e3d8;--accent:#b26728}
@media (prefers-color-scheme:dark){:root{--bg:#1e201b;--ink:#ecefe4;--muted:#a3a995;--line:#3a3d33}}
html,body{height:100%;margin:0}body{display:flex;flex-direction:column;background:var(--bg);color:var(--ink);font:13px/1.4 -apple-system,BlinkMacSystemFont,sans-serif}
#strip{padding:10px 16px;border-bottom:1px solid var(--line)}#name{font-weight:600}#consent{color:var(--muted);font-size:12px}#consent:empty{display:none}
iframe{flex:1;border:0;width:100%;background:var(--bg)}#away{padding:16px;color:var(--muted)}
</style></head><body>
<div id="strip"><div id="name">Recipe Box</div><div id="consent"></div></div>
<iframe id="app" hidden></iframe>
<p id="away" hidden></p>
<script src="panel.js"></script></body></html>
