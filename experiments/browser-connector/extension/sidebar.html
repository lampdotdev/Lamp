<!doctype html><html><head><meta charset="utf-8"><title>Lamp</title>
<style>
:root{color-scheme:light dark;--bg:#fcfcf7;--ink:#252820;--muted:#626858;--line:#e0e3d8;--field:#bbc3ae;--green:#3d5736;--on-green:white;--card:white;--accent:#b26728}
@media (prefers-color-scheme:dark){:root{--bg:#1e201b;--ink:#ecefe4;--muted:#a3a995;--line:#3a3d33;--field:#5a6150;--green:#9cc48d;--on-green:#16200f;--card:#272a23}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,BlinkMacSystemFont,sans-serif}
#top{padding:14px 20px 0}#chooser{font-weight:600;font-size:15px}#offer{color:var(--accent);font-weight:600;margin:6px 0 0}
select{font:inherit;max-width:100%;padding:7px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
main{padding:12px 20px 170px}#controls{position:fixed;bottom:0;left:0;right:0;padding:12px 20px 18px;background:var(--bg);border-top:1px solid var(--line)}
h1{font:600 26px/1.15 Georgia,serif;margin:6px 0 12px}h2{font-size:12px;text-transform:uppercase;letter-spacing:.08em;margin:22px 0 8px;color:var(--green)}
p{white-space:pre-line;margin:0 0 12px}ul{margin:0 0 12px;padding-left:20px}li{margin:2px 0}#detail,#consent,#empty,#note{color:var(--muted)}#consent{font-size:12px;margin:0 0 10px}
label{display:block;margin:14px 0}input,textarea{display:block;width:100%;font:inherit;padding:8px;border:1px solid var(--field);border-radius:7px;margin-top:5px;background:var(--card);color:var(--ink)}textarea{resize:vertical}
button{font:600 14px/1.3 -apple-system,sans-serif;border:1px solid var(--field);background:var(--card);color:var(--green);border-radius:9px;padding:10px 15px;cursor:pointer}
#actions button:first-child{background:var(--green);color:var(--on-green);border-color:var(--green)}button:disabled{opacity:.55;cursor:wait}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#actions{display:flex;flex-wrap:wrap;gap:9px}#error{margin:8px 20px 0;color:#c2412a}#error:empty{display:none}#empty,#note{padding:4px 20px}
#consent-top{color:var(--muted);font-size:12px;margin:4px 0 0}#consent-top:empty{display:none}
/* Above an app's own page: the window's gray and Mac-sized type, as the page's /lamp.css draws, so the strip and
   the page read as one sidebar. */
body.framed{display:flex;flex-direction:column;height:100vh;--bg:#eff1f2;--line:#dadcde;--ink:#1d1d1f;--muted:#6e6e73;font-size:13px}
@media (prefers-color-scheme:dark){body.framed{--bg:#1e1f20;--line:#3a3b3d;--ink:#f5f5f7;--muted:#98989d}}
body.framed{background:var(--page-bg,var(--bg));color:var(--page-ink,var(--ink))}
body.framed #top{padding:12px 16px 9px;border-bottom:1px solid var(--page-line,var(--line))}body.framed #offer{color:var(--page-accent,var(--accent))}body.framed #consent-top{color:var(--page-muted,var(--muted))}body.framed #chooser{font-size:13px}body.framed #offer{font-weight:500;font-size:12px;margin-top:3px}
#top:focus{outline:none}#page{flex:1;width:100%;border:0;background:var(--page-bg,var(--bg))}#page[hidden]{display:none}
</style></head><body>
<div id="top"><div id="chooser"></div><p id="offer" hidden></p><p id="consent-top"></p></div>
<p id="error" role="alert"></p>
<p id="note" role="status" hidden></p>
<p id="empty" hidden>None of your Lamp apps work beside web pages yet. Ask Lamp for one, like “Keep the recipes I find.”</p>
<iframe id="page" hidden sandbox="allow-scripts allow-forms allow-same-origin" title="App"></iframe>
<main hidden><h1 id="title"></h1><p id="detail" role="status"></p><div id="fields"></div><div id="sections"></div>
<div id="controls"><p id="consent"></p><div id="actions"></div></div></main>
<script src="sidebar.js"></script></body></html>
