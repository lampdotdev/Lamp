<!doctype html><html><head><meta charset="utf-8"><title>Lamp</title>
<style>
/* Drawn to sit beside the app's Mac window as a part of it: the window's gray, Mac-sized type and controls, sections as
   grouped boxes, and the app's color only where its window uses it. Lamp's own colors show until the app's look
   arrives (sidebar.js); the app's kind picks the template (a class on the body). */
:root{color-scheme:light dark;--bg:#eff1f2;--card:#fdfdfd;--line:#dadcde;--field:#c4c7ca;--ink:#1d1d1f;--muted:#6e6e73;--accent:#3d5736;--fill:#3d5736;--on-fill:#ffffff;
--face:-apple-system,BlinkMacSystemFont,system-ui,sans-serif;--body-face:var(--face);--title-weight:700;--title-size:20px;--radius:10px;--button-radius:7px;--shadow:0 .5px 1.5px rgba(0,0,0,.1)}
@media (prefers-color-scheme:dark){:root{--bg:#1e1f20;--card:#2a2b2c;--line:#3a3b3d;--field:#505255;--ink:#f5f5f7;--muted:#98989d;--accent:#9cc48d;--fill:#9cc48d;--on-fill:#16200f;--shadow:none}}
body.companion{--title-size:26px;--radius:16px;--button-radius:999px}
body.collection{--title-size:22px;--radius:12px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.45 var(--body-face);-webkit-font-smoothing:antialiased}
#top{display:flex;align-items:center;gap:9px;padding:14px 16px 0}#icon{width:26px;height:26px;flex:none}#icon:not([src]),#icon[src=""]{display:none}
#chooser{font:600 13px/1.3 var(--face);min-width:0}
#offer{color:var(--accent);font:500 12px/1.4 var(--body-face);margin:4px 16px 0 51px}
select{font:inherit;max-width:100%;padding:3px 6px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
main{padding:6px 16px 150px}
h1{font:var(--title-weight) var(--title-size)/1.2 var(--face);letter-spacing:-.012em;margin:12px 0 4px}h1:empty{display:none}
#detail{color:var(--muted);margin:0 0 6px;white-space:pre-line}#detail:empty{display:none}
h2{font:600 12px/1.3 var(--face);color:var(--ink);margin:18px 2px 6px}
.box{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.box p{margin:0;padding:9px 12px;white-space:pre-line}
.box ul{list-style:none;margin:0;padding:0}.box li{padding:7px 12px;border-top:1px solid var(--line)}.box ul:first-child li:first-child{border-top:0}
.picture{margin:14px 0 0}.picture img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;background:var(--line)}
.picture img.art{object-fit:contain;padding:7%;background:color-mix(in srgb,var(--fill) 14%,var(--card))}
.picture .words{padding:10px 12px}.picture h3{font:600 15px/1.3 var(--face);margin:0}.picture .words p{color:var(--muted);margin:2px 0 0;padding:0}
.picture ul li:first-child{border-top:1px solid var(--line)}
body.companion .picture img{aspect-ratio:1}
label{display:block;margin:12px 0 0;font-weight:500}
input,textarea{display:block;width:100%;font:400 13px/1.45 var(--body-face);padding:5px 8px;border:1px solid var(--field);border-radius:6px;margin-top:4px;background:var(--card);color:var(--ink)}textarea{resize:vertical}
#controls{position:fixed;bottom:0;left:0;right:0;padding:10px 16px 14px;background:var(--bg);border-top:1px solid var(--line)}
#consent{font-size:11px;color:var(--muted);margin:0 0 8px}#consent:empty{display:none}
#actions{display:flex;flex-wrap:wrap;gap:8px}
button{font:600 13px/1.3 var(--face);min-height:28px;padding:5px 14px;border:1px solid var(--line);border-radius:var(--button-radius);background:var(--card);color:var(--ink);box-shadow:var(--shadow);cursor:pointer}
body.companion button{font-size:15px;padding:9px 20px}
#actions button:first-child{background:var(--fill);color:var(--on-fill);border-color:var(--fill)}button:disabled{opacity:.5;cursor:wait}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 50%,transparent);outline-offset:1px}
#error{margin:8px 16px 0;color:#c2412a}#error:empty{display:none}#empty,#note{padding:4px 16px;color:var(--muted)}
</style></head><body>
<div id="top"><img id="icon" alt=""><div id="chooser"></div></div><p id="offer" hidden></p>
<p id="error" role="alert"></p>
<p id="note" role="status" hidden></p>
<p id="empty" hidden>None of your Lamp apps work beside web pages yet. Ask Lamp for one, like “Keep the recipes I find.”</p>
<main hidden><h1 id="title"></h1><p id="detail" role="status"></p><div id="fields"></div><div id="sections"></div>
<div id="controls"><p id="consent"></p><div id="actions"></div></div></main>
<script src="sidebar.js"></script></body></html>
