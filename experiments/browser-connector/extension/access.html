<!doctype html><html><head><meta charset="utf-8"><title>Lamp browser access</title>
<style>
body{max-width:640px;margin:32px auto;padding:24px;background:#faf8f4;color:#222;font:14px system-ui}h1{font-size:21px;margin:0 0 14px}h2{font-size:16px}p{line-height:1.45;overflow-wrap:anywhere}button,select{font:inherit;padding:9px 12px;border-radius:8px;border:1px solid #bbb;background:white}#approve{background:#a94312;color:white;border-color:#a94312}select{width:100%}.grant{border-top:1px solid #ddd;padding:12px 0}label{display:block;line-height:1.4;margin:12px 0}#status{white-space:pre-wrap}
</style></head><body><h1>Browser access</h1><p id="status">Connecting to Lamp…</p>
<section id="request" hidden><select id="destination" aria-label="Destination app"></select><p id="consent"></p>
<label><input id="openClosed" type="checkbox">Open a background tab if the page is closed</label>
<button id="approve">Allow this app on this site</button></section>
<h2>Approved apps</h2><div id="grants"></div><script src="popup.js"></script></body></html>
