<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Relay prototype: stand-in game page</title>
  <link rel="stylesheet" href="/w/page.css">
  <script src="/w/page.js" defer></script>
</head>
<body>
  <!-- STAND-IN for lamp.dev/w/<id>, served by the local relay prototype. The real page is untouched. -->
  <header>
    <strong>Demo game</strong>
    <span class="standin">Stand-in for lamp.dev/w/&lt;id&gt; · local relay prototype</span>
  </header>
  <main>
    <iframe id="game" title="The game" sandbox="allow-scripts allow-same-origin"></iframe>
  </main>
  <footer>
    <section id="pair">
      <span>Change this game with your own agent. On your Mac, run</span>
      <code id="command">lamp play ······</code>
      <span id="expires"></span>
      <button id="new-code" hidden>New code</button>
    </section>
    <form id="ask" hidden>
      <input id="prompt" autocomplete="off" placeholder="What should change?" maxlength="2000">
      <button id="send" type="submit">Send</button>
    </form>
    <p id="status" role="status">Opening…</p>
    <ol id="requests"></ol>
  </footer>
</body>
</html>
